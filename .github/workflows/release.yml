name: Release

# 同梱ライブラリ(lib/l2d-updater)が提供する reusable workflow を呼び、
# タグから配布用 ZIP を組み立てて GitHub Release を作成する。
#
# 参照タグ(@X.Y.Z)は lib/l2d-updater/ のベンダーコピーと必ず揃えること。
# 片方だけ更新すると、ライブラリ本体と利用側で版が食い違う。ライブラリ
# 側の反映手順は https://github.com/lunaluna/l2d-wp-github-update-lib を
# 参照(1.1.0 以降、手順はベンダーコピーには同梱されない)。

on:
  push:
    tags:
      # v 付き(v1.2.3)と素の semver(1.2.3)の両方を受ける.
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 1.6.0). Leave blank when triggered by tag push.'
        required: false

# 呼び出し先の GITHUB_TOKEN 権限は呼び出し元を超えられないため、
# Release 作成に必要な contents: write はここで与える必要がある.
permissions:
  contents: write

jobs:
  release:
    uses: lunaluna/l2d-wp-github-update-lib/.github/workflows/plugin-release.yml@1.2.0
    with:
      slug: wp-maintenance-audit-reporter
      # "path:pattern" 形式。参照タグ(@1.2.0)は lib/l2d-updater/ のベンダーコピーと
      # 必ず揃えること。片方だけ更新すると版が食い違う.
      version_files: |
        wp-maintenance-audit-reporter.php:^[[:space:]]*\*[[:space:]]*Version:
        wp-maintenance-audit-reporter.php:define\( *'WPMAR_VERSION'
        readme.txt:^Stable tag:
        readme-ja.txt:^Stable tag:
        composer.json:"version":
      notes_source: CHANGELOG.md
      php_version: '8.2'
      extra_assets: |
        vendor-pdf.zip
        vendor-pdf.zip.sha256
      draft: true
