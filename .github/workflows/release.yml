name: Release

on:
  push:
    tags:
      # Accept both v-prefixed (v1.2.3) and bare semver (1.2.3) tags.
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 0.10.2 or v0.10.2). Leave blank when triggered by tag push.'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build plugin zip and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Release tag could not be resolved."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches plugin header version
        run: |
          HEADER_VERSION=$(grep -E '^[[:space:]]*\*[[:space:]]*Version:' wp-maintenance-audit-reporter.php \
            | head -n1 | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r')
          echo "Plugin header version: $HEADER_VERSION"
          echo "Release version:       ${{ steps.tag.outputs.version }}"
          if [ "$HEADER_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Tag (${{ steps.tag.outputs.version }}) does not match plugin header version ($HEADER_VERSION)."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Build Noto Sans JP static fonts (Regular + Bold)
        # mPDF cannot embed CFF/OpenType outlines, and Noto Sans JP ships as a
        # single variable TTF (no distinct bold). Pin the weight axis into static
        # Regular (400) / Bold (700) TrueType instances with fontTools.
        run: |
          python3 -m pip install --quiet fonttools brotli
          mkdir -p fonts
          curl -fsSL \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf" \
            -o /tmp/NotoSansJP-VF.ttf
          # --update-name-table fixes each instance's naming/bold bits from STAT
          # (family "Noto Sans JP", Regular/Bold subfamily, distinct PS names).
          python3 -m fontTools.varLib.instancer --update-name-table /tmp/NotoSansJP-VF.ttf wght=400 \
            -o fonts/NotoSansJP-Regular.ttf
          python3 -m fontTools.varLib.instancer --update-name-table /tmp/NotoSansJP-VF.ttf wght=700 \
            -o fonts/NotoSansJP-Bold.ttf
          rm -f /tmp/NotoSansJP-VF.ttf

      - name: Create vendor-pdf.zip
        id: vendor_zip
        run: |
          zip -rq -X vendor-pdf.zip vendor/ fonts/
          echo "vendor_zip_path=$GITHUB_WORKSPACE/vendor-pdf.zip" >> "$GITHUB_OUTPUT"

      - name: Checksum vendor-pdf.zip
        id: vendor_zip_sha
        run: |
          # Publish the SHA-256 as a release asset so installs can pin it via the
          # WPMAR_PDF_VENDOR_ZIP_SHA256 constant / wpmar_pdf_vendor_zip_sha256 filter.
          SHA="$(shasum -a 256 vendor-pdf.zip | awk '{print $1}')"
          echo "$SHA" > vendor-pdf.zip.sha256
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "vendor_zip_sha_path=$GITHUB_WORKSPACE/vendor-pdf.zip.sha256" >> "$GITHUB_OUTPUT"
          echo "vendor-pdf.zip SHA-256: $SHA"
          # Also written as vendor-pdf.sha256 at repo root (deliberately distinct
          # name from the release asset above) so the "Assemble plugin zip" step
          # bundles it into the main plugin package: this enables checksum
          # verification by default for anyone installing the official release,
          # without a second network round-trip to fetch a sidecar file.
          echo "$SHA" > vendor-pdf.sha256

      - name: Assemble plugin zip
        id: zip
        run: |
          # bin/build-zip.sh is the single source of truth for how the plugin
          # zip is built (staging, .distignore excludes, Action Scheduler
          # bundling into lib/). Calling it here instead of duplicating its
          # logic is what keeps CI and local builds from drifting apart.
          bash bin/build-zip.sh
          SLUG="wp-maintenance-audit-reporter"
          ZIP_NAME="${SLUG}.${{ steps.tag.outputs.version }}.zip"
          # build-zip.sh writes the zip one directory above the plugin root
          # (see its usage comment); $GITHUB_WORKSPACE is the plugin root here.
          ZIP_PATH="$(dirname "$GITHUB_WORKSPACE")/${ZIP_NAME}"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Expected zip not found at $ZIP_PATH"
            exit 1
          fi
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          NOTES_FILE="$(mktemp)"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              BEGIN { capture = 0 }
              /^##[[:space:]]/ {
                if (capture) { exit }
                if (index($0, "[" ver "]") > 0 || index($0, ver) > 0) { capture = 1; next }
              }
              capture { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Automated release for ${{ steps.tag.outputs.tag }}." > "$NOTES_FILE"
          fi
          echo "notes_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            "${{ steps.zip.outputs.zip_path }}" \
            "${{ steps.vendor_zip.outputs.vendor_zip_path }}#vendor-pdf.zip" \
            "${{ steps.vendor_zip_sha.outputs.vendor_zip_sha_path }}#vendor-pdf.zip.sha256" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file "${{ steps.notes.outputs.notes_path }}"
