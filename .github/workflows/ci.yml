name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  phpcompat:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '8.0', '8.2', '8.3' ]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Audit production dependencies for known vulnerabilities
        run: composer audit --no-dev

      - name: Audit dev dependencies for known vulnerabilities
        run: composer audit

      - name: Run PHPCS
        run: composer run phpcs

      - name: Run PHPUnit
        run: composer run phpunit
