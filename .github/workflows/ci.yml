name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  phpcompat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '8.0', '8.2', '8.3' ]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (2.37.2)
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Audit production dependencies for known vulnerabilities
        run: composer audit --no-dev

      - name: Audit dev dependencies for known vulnerabilities
        run: composer audit

      - name: Run PHPCS
        run: composer run phpcs

      - name: Run PHPUnit
        run: composer run phpunit
